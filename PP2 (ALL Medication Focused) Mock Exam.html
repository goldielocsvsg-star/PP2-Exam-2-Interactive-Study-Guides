<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCC2 Cardiac Pharmacology Mock Exam ✦ Perfusion & Coagulation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --hot-pink: #ff2d9c;
  --bubblegum: #ff6ec7;
  --lavender: #c084fc;
  --purple-deep: #7c3aed;
  --purple-mid: #a855f7;
  --violet: #d946ef;
  --pink-light: #fce7f3;
  --pink-pale: #fdf2f8;
  --dark-bg: #0d0012;
  --dark-card: #150022;
  --dark-surface: #1e0035;
  --glassy: rgba(255,255,255,0.06);
  --text-bright: #fff0ff;
  --text-muted: #d8b4fe;
  --ekg-green: #39ff14;
  --gold: #fbbf24;
  --error-red: #f87171;
  --success-green: #4ade80;
  --border-glow: rgba(192, 132, 252, 0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--dark-bg);
  color: var(--text-bright);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(255,45,156,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 50%, rgba(217,70,239,0.06) 0%, transparent 70%);
}

/* ── EKG HEADER ── */
.exam-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,0,18,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-glow);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.header-logo {
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--hot-pink);
  text-shadow: 0 0 12px var(--hot-pink);
  flex-shrink: 0;
}

.ekg-svg-container {
  flex: 1;
  min-width: 120px;
  height: 32px;
  overflow: hidden;
}

.ekg-line {
  stroke: var(--ekg-green);
  stroke-width: 1.8;
  fill: none;
  filter: drop-shadow(0 0 4px var(--ekg-green));
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
  animation: ekg-draw 2s ease-out forwards, ekg-pulse 2s 2s ease-in-out infinite;
}

@keyframes ekg-draw { to { stroke-dashoffset: 0; } }
@keyframes ekg-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.header-counter {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--lavender);
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.progress-bar-wrap {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  margin-top: 6px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--hot-pink), var(--purple-mid), var(--lavender));
  transition: width 0.5s ease;
  box-shadow: 0 0 8px var(--hot-pink);
}

/* ── MAIN CONTAINER ── */
.exam-wrapper {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 20px 100px;
}

/* ── QUESTION CARD ── */
.question-screen {
  display: none;
  animation: fadeSlide 0.4s ease;
}
.question-screen.active { display: block; }

@keyframes fadeSlide {
  from { opacity:0; transform: translateY(18px); }
  to   { opacity:1; transform: translateY(0); }
}

.q-badge-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.q-number-badge {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  padding: 4px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--hot-pink), var(--violet));
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  box-shadow: 0 0 10px rgba(255,45,156,0.4);
}

.q-type-badge {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border-glow);
  color: var(--lavender);
  background: var(--glassy);
}

.q-topic-badge {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(124,58,237,0.2);
  border: 1px solid rgba(168,85,247,0.3);
  color: var(--purple-mid);
  margin-left: auto;
}

.question-card {
  background: var(--dark-card);
  border: 1px solid var(--border-glow);
  border-radius: 16px;
  padding: 28px 32px;
  margin-bottom: 20px;
  box-shadow: 0 4px 40px rgba(124,58,237,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--hot-pink), var(--purple-mid), var(--violet), transparent);
}

.case-scenario {
  background: rgba(124,58,237,0.1);
  border-left: 3px solid var(--purple-mid);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--text-muted);
}

.case-scenario strong { color: var(--lavender); }
.case-scenario .vital-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
  gap: 6px;
  margin-top: 10px;
}
.vital-chip {
  background: rgba(217,70,239,0.1);
  border: 1px solid rgba(217,70,239,0.25);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--bubblegum);
}

.question-stem {
  font-size: 1.02rem;
  font-weight: 600;
  line-height: 1.65;
  color: var(--text-bright);
  margin-bottom: 6px;
}

.question-instruction {
  font-size: 0.78rem;
  color: var(--bubblegum);
  font-style: italic;
  margin-bottom: 18px;
  font-weight: 600;
}

/* ── MCQ OPTIONS ── */
.options-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-item {
  position: relative;
}

.option-btn {
  width: 100%;
  text-align: left;
  background: var(--dark-surface);
  border: 1.5px solid rgba(168,85,247,0.2);
  border-radius: 10px;
  padding: 13px 18px 13px 50px;
  color: var(--text-bright);
  font-family: 'Nunito', sans-serif;
  font-size: 0.91rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  line-height: 1.5;
  position: relative;
}

.option-btn::before {
  content: attr(data-letter);
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(124,58,237,0.25);
  border: 1.5px solid rgba(168,85,247,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--lavender);
  line-height: 26px;
  text-align: center;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--lavender);
  background: rgba(124,58,237,0.15);
  transform: translateX(3px);
  box-shadow: 0 0 12px rgba(192,132,252,0.2);
}

.option-btn.correct {
  border-color: var(--success-green);
  background: rgba(74,222,128,0.1);
  box-shadow: 0 0 14px rgba(74,222,128,0.2);
}

.option-btn.incorrect {
  border-color: var(--error-red);
  background: rgba(248,113,113,0.1);
}

.option-btn.selected-pending {
  border-color: var(--hot-pink);
  background: rgba(255,45,156,0.12);
  box-shadow: 0 0 12px rgba(255,45,156,0.25);
  transform: translateX(3px);
}

.option-btn.reveal-correct {
  border-color: var(--success-green);
  background: rgba(74,222,128,0.08);
  opacity: 0.7;
}

/* ── SATA OPTIONS ── */
.sata-option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--dark-surface);
  border: 1.5px solid rgba(168,85,247,0.2);
  border-radius: 10px;
  padding: 13px 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text-bright);
  font-size: 0.91rem;
  font-weight: 500;
  line-height: 1.5;
}

.sata-option:hover:not(.locked) {
  border-color: var(--lavender);
  background: rgba(124,58,237,0.15);
}

.sata-check {
  width: 20px;
  height: 20px;
  min-width: 20px;
  border-radius: 4px;
  border: 2px solid rgba(168,85,247,0.5);
  background: transparent;
  transition: all 0.2s ease;
  margin-top: 1px;
  position: relative;
}

.sata-option.selected .sata-check {
  background: var(--purple-mid);
  border-color: var(--purple-mid);
}
.sata-option.selected .sata-check::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.7rem;
  font-weight: 900;
}

.sata-option.correct-sel {
  border-color: var(--success-green);
  background: rgba(74,222,128,0.1);
}
.sata-option.incorrect-sel {
  border-color: var(--error-red);
  background: rgba(248,113,113,0.1);
}
.sata-option.missed {
  border-color: var(--gold);
  background: rgba(251,191,36,0.08);
}

.sata-submit-btn {
  margin-top: 14px;
  padding: 11px 28px;
  background: linear-gradient(135deg, var(--hot-pink), var(--purple-mid));
  border: none;
  border-radius: 10px;
  color: white;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(255,45,156,0.3);
}
.sata-submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,45,156,0.5);
}
.sata-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── MATRIX TABLE ── */
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 0.84rem;
}

.matrix-table th {
  background: rgba(124,58,237,0.25);
  color: var(--lavender);
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  padding: 10px 12px;
  text-align: center;
  border: 1px solid rgba(168,85,247,0.2);
}

.matrix-table td {
  padding: 10px 12px;
  border: 1px solid rgba(168,85,247,0.15);
  color: var(--text-bright);
  vertical-align: middle;
  line-height: 1.45;
}

.matrix-table td:first-child {
  color: var(--text-muted);
  font-weight: 600;
  background: rgba(13,0,18,0.4);
}

.matrix-radio-group {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.matrix-radio {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(168,85,247,0.4);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.5rem;
}
.matrix-radio:hover { border-color: var(--lavender); background: rgba(124,58,237,0.2); }
.matrix-radio.selected { background: var(--purple-mid); border-color: var(--purple-mid); }
.matrix-radio.selected::after { content: '●'; color: white; font-size: 0.5rem; }

/* ── BOW TIE ── */
.bowtie-container {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: start;
  margin-top: 16px;
}

.bowtie-column {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bowtie-header {
  font-family: 'Orbitron', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  color: var(--hot-pink);
  text-align: center;
  padding: 6px;
  border-bottom: 1px solid rgba(255,45,156,0.3);
  margin-bottom: 4px;
}

.bowtie-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 100px;
}

.bowtie-diamond {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(217,70,239,0.3));
  border: 2px solid var(--purple-mid);
  transform: rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  box-shadow: 0 0 20px rgba(168,85,247,0.3);
}

.bowtie-diamond-text {
  transform: rotate(-45deg);
  font-family: 'Orbitron', monospace;
  font-size: 0.5rem;
  font-weight: 700;
  color: var(--lavender);
  letter-spacing: 0.05em;
  text-align: center;
  line-height: 1.3;
}

.bowtie-option {
  background: var(--dark-surface);
  border: 1.5px solid rgba(168,85,247,0.2);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 0.82rem;
  color: var(--text-bright);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  line-height: 1.4;
}
.bowtie-option:hover:not(.locked) {
  border-color: var(--lavender);
  background: rgba(124,58,237,0.15);
}
.bowtie-option.selected {
  border-color: var(--purple-mid);
  background: rgba(168,85,247,0.15);
  box-shadow: 0 0 10px rgba(168,85,247,0.3);
}
.bowtie-option.correct-sel { border-color: var(--success-green); background: rgba(74,222,128,0.1); }
.bowtie-option.incorrect-sel { border-color: var(--error-red); background: rgba(248,113,113,0.1); }
.bowtie-option.reveal-correct { border-color: var(--gold); background: rgba(251,191,36,0.08); }

/* ── RATIONALE ── */
.rationale-box {
  display: none;
  margin-top: 18px;
  background: rgba(13,0,18,0.6);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 12px;
  padding: 20px 24px;
  animation: fadeSlide 0.4s ease;
}

.rationale-box.show { display: block; }

.rationale-header {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.rationale-header::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.rationale-text {
  font-size: 0.88rem;
  line-height: 1.75;
  color: var(--text-muted);
}

.rationale-text strong { color: var(--lavender); }
.rationale-text .correct-tag { color: var(--success-green); font-weight: 700; }
.rationale-text .wrong-tag { color: var(--error-red); font-weight: 700; }

.key-points {
  margin-top: 12px;
  padding: 10px 14px;
  background: rgba(124,58,237,0.1);
  border-left: 3px solid var(--purple-mid);
  border-radius: 6px;
  font-size: 0.82rem;
  color: var(--lavender);
  line-height: 1.65;
}

/* ── NAVIGATION ── */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 22px;
  gap: 12px;
  flex-wrap: wrap;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 10px;
  border: 1.5px solid var(--border-glow);
  background: var(--glassy);
  color: var(--lavender);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.03em;
}

.nav-btn:hover {
  border-color: var(--purple-mid);
  background: rgba(124,58,237,0.2);
  color: white;
}

.nav-btn.primary {
  background: linear-gradient(135deg, var(--hot-pink), var(--purple-mid));
  border-color: transparent;
  color: white;
  box-shadow: 0 4px 15px rgba(255,45,156,0.3);
}

.nav-btn.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,45,156,0.5);
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
}

.score-chip {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--bubblegum);
  letter-spacing: 0.1em;
}

/* ── Q NAVIGATOR GRID ── */
.q-nav-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hot-pink), var(--purple-deep));
  border: none;
  cursor: pointer;
  font-size: 1.3rem;
  box-shadow: 0 4px 20px rgba(255,45,156,0.5);
  z-index: 200;
  transition: transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.q-nav-toggle:hover { transform: scale(1.1); }

.q-nav-panel {
  position: fixed;
  bottom: 80px;
  right: 20px;
  background: var(--dark-card);
  border: 1px solid var(--border-glow);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  z-index: 200;
  display: none;
  width: 280px;
}
.q-nav-panel.open { display: block; animation: fadeSlide 0.3s ease; }

.q-nav-panel-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: var(--lavender);
  margin-bottom: 10px;
}

.q-nav-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}

.q-nav-dot {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  border: 1px solid rgba(168,85,247,0.3);
  background: var(--dark-surface);
  font-family: 'Space Mono', monospace;
  font-size: 0.5rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.q-nav-dot:hover { border-color: var(--lavender); color: white; }
.q-nav-dot.current { background: var(--hot-pink); border-color: var(--hot-pink); color: white; box-shadow: 0 0 8px rgba(255,45,156,0.6); }
.q-nav-dot.answered-correct { background: rgba(74,222,128,0.3); border-color: var(--success-green); color: var(--success-green); }
.q-nav-dot.answered-wrong { background: rgba(248,113,113,0.2); border-color: var(--error-red); color: var(--error-red); }

/* ── POPUP ── */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.popup-overlay.show { display: flex; }

.popup-card {
  background: var(--dark-card);
  border: 2px solid var(--border-glow);
  border-radius: 20px;
  padding: 36px 40px;
  max-width: 440px;
  width: 90%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,45,156,0.3);
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.popup-emoji { font-size: 3rem; margin-bottom: 12px; }
.popup-title { font-family: 'Orbitron', monospace; font-size: 1.1rem; color: var(--hot-pink); margin-bottom: 8px; text-shadow: 0 0 15px var(--hot-pink); }
.popup-msg { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
.popup-close-btn {
  margin-top: 20px;
  padding: 10px 30px;
  background: linear-gradient(135deg, var(--hot-pink), var(--violet));
  border: none;
  border-radius: 10px;
  color: white;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255,45,156,0.4);
}

/* ── SCORE SCREEN ── */
.score-screen {
  display: none;
  text-align: center;
  padding: 40px 20px;
  animation: fadeSlide 0.6s ease;
}
.score-screen.active { display: block; }

.score-circle {
  width: 160px;
  height: 160px;

{

// Q3 — Spironolactone hyperkalemia

{

  type: 'mcq',

  keyPoint: '🔑 The dry cough with ACE inhibitors is caused by bradykinin accumulation (ACE normally breaks down bradykinin). ARBs block AT-II receptors WITHOUT affecting bradykinin — no cough, similar cardiac/renal protection.'

{

  keyPoint: '🔑 CCB classes: Dihydropyridines (nifedipine, amlodipine) = vascular selectivity → HTN/angina. Non-DHPs (diltiazem, verapamil) = cardiac + vascular → HTN + rate control. Grapefruit juice increases CCB drug levels!'

{

  keyPoint: '🔑 Digoxin drug-drug interactions: CCBs (diltiazem, verapamil) and diuretics (hypokalemia) increase digoxin toxicity. Monitor: HR (hold if <60), digoxin level (normal 0.5–2 ng/mL), K⁺ levels.'

let answeredQ = new Array(questions.length).fill(null); // null=unanswered, true/false
let sataSelections = [];
let bowtieLeftSel = [];
let bowtieRightSel = [];
let matrixAnswers = [];
let revealed = false;

const CORRECT_MESSAGES = [
  { emoji: '🎉', title: 'NAILED IT!', msg: 'That clinical reasoning was PERFECT! You\'re thinking like a nurse! 💊✨' },
  { emoji: '⚡', title: 'BRILLIANT!', msg: 'Your pharmacology knowledge is seriously impressive! Keep going! 🔥' },
  { emoji: '💖', title: 'YES QUEEN!', msg: 'Correct! You understand the mechanism AND the nursing implications! 🌸' },
  { emoji: '🌟', title: 'SUPERSTAR!', msg: 'That\'s the kind of thinking that saves lives! You\'re amazing! 💫' },
  { emoji: '🧠', title: 'BIG BRAIN!', msg: 'Clinical judgment ON POINT. Your cohort is lucky to have you! 💜' },
  { emoji: '🏆', title: 'CHAMPION!', msg: 'Perfect! You connected the pathophysiology to the pharmacology beautifully! 🎀' },
  { emoji: '✨', title: 'PERFECTION!', msg: 'Correct! That critical thinking will absolutely show on exam day! 💗' },
  { emoji: '🌺', title: 'FANTASTIC!', msg: 'You know your meds AND when to hold them! That\'s nursing excellence! 🌷' },
];

// ════════════════════════════════════════════════════
//  BUILD DOM
// ════════════════════════════════════════════════════
function buildAllQuestions() {
  const wrapper = document.getElementById('examWrapper');
  questions.forEach((q, i) => {
    const screen = document.createElement('div');
    screen.className = 'question-screen' + (i === 0 ? ' active' : '');
    screen.id = 'qscreen-' + i;
    screen.innerHTML = buildQuestionHTML(q, i);
    wrapper.appendChild(screen);
  });
}

function buildQuestionHTML(q, i) {
  let scenarioHTML = '';
  if (q.scenario) {
    scenarioHTML = `<div class="case-scenario"><strong>📋 Clinical Scenario:</strong><br>${q.scenario}</div>`;
  }

  let bodyHTML = '';
  if (q.type === 'mcq') {
    bodyHTML = buildMCQ(q, i);
  } else if (q.type === 'sata') {
    bodyHTML = buildSATA(q, i);
  } else if (q.type === 'matrix') {
    bodyHTML = buildMatrix(q, i);
  } else if (q.type === 'bowtie') {
    bodyHTML = buildBowtie(q, i);
  }

  const typeLabels = { mcq:'Multiple Choice', sata:'Select All That Apply', matrix:'Matrix', bowtie:'Bow-Tie' };

  return `
    <div class="q-badge-row">
      <div class="q-number-badge">QUESTION ${i+1}</div>
      <div class="q-type-badge">${typeLabels[q.type]}</div>
      <div class="q-topic-badge">${q.topic}</div>
    </div>
    <div class="question-card">
      ${scenarioHTML}
      <div class="question-stem">${q.stem}</div>
      ${q.type === 'sata' ? '<div class="question-instruction">Select all that apply — then click Submit.</div>' : ''}
      ${q.type === 'bowtie' ? '<div class="question-instruction">Select the best choices for each column.</div>' : ''}
      ${bodyHTML}
      <div class="rationale-box" id="rationale-${i}">
        <div class="rationale-header">📚 Rationale</div>
        <div class="rationale-text">${q.rationale}</div>
        ${q.keyPoint ? `<div class="key-points">${q.keyPoint}</div>` : ''}
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="goTo(${i-1})" ${i===0?'disabled':''}>← Previous</button>
      <div class="score-chip" id="scorechip-${i}">Score: ${score}/${i}</div>
      <button class="nav-btn primary" id="nextbtn-${i}" onclick="goTo(${i+1})" ${i===questions.length-1?'onclick="showScore()" ':''}>
        ${i===questions.length-1 ? 'View Results 🏆' : 'Next →'}
      </button>
    </div>
  `;
}

function buildMCQ(q, i) {
  return `<ul class="options-list" id="mcq-list-${i}">
    ${q.options.map((opt, j) => `
      <li class="option-item">
        <button class="option-btn" data-letter="${String.fromCharCode(65+j)}" onclick="selectMCQ(${i},${j})" id="opt-${i}-${j}">
          ${opt}
        </button>
      </li>`).join('')}
  </ul>
  <button class="sata-submit-btn" id="mcq-submit-${i}" onclick="answerMCQ(${i})" disabled>Submit Answer</button>`;
}

function buildSATA(q, i) {
  return `<ul class="options-list" id="sata-list-${i}">
    ${q.options.map((opt, j) => `
      <li>
        <div class="sata-option" id="sataopt-${i}-${j}" onclick="toggleSATA(${i},${j})">
          <div class="sata-check" id="satacheck-${i}-${j}"></div>
          <span>${opt}</span>
        </div>
      </li>`).join('')}
  </ul>
  <button class="sata-submit-btn" id="sata-submit-${i}" onclick="submitSATA(${i})">Submit Answer</button>`;
}

function buildMatrix(q, i) {
  return `<table class="matrix-table">
    <thead>
      <tr>
        <th>Intervention / Statement</th>
        ${q.cols.map(c=>`<th>${c}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${q.rows.map((row,r)=>`
        <tr>
          <td>${row}</td>
          ${q.cols.map((_,c)=>`
            <td>
              <div class="matrix-radio-group">
                <button class="matrix-radio" id="mrad-${i}-${r}-${c}" onclick="selectMatrix(${i},${r},${c})"></button>
              </div>
            </td>`).join('')}
        </tr>`).join('')}
    </tbody>
  </table>
  <button class="sata-submit-btn" id="matrix-submit-${i}" style="margin-top:14px" onclick="submitMatrix(${i})">Submit Matrix</button>`;
}

function buildBowtie(q, i) {
  return `<div class="bowtie-container">
    <div class="bowtie-column">
      <div class="bowtie-header">${q.leftHeader}</div>
      ${q.leftOptions.map((opt,j)=>`
        <div class="bowtie-option" id="btleft-${i}-${j}" onclick="toggleBowtieLeft(${i},${j})">${opt}</div>`).join('')}
    </div>
    <div class="bowtie-center">
      <div class="bowtie-diamond"><div class="bowtie-diamond-text">${q.centerText}</div></div>
    </div>
    <div class="bowtie-column">
      <div class="bowtie-header">${q.rightHeader}</div>
      ${q.rightOptions.map((opt,j)=>`
        <div class="bowtie-option" id="btright-${i}-${j}" onclick="toggleBowtieRight(${i},${j})">${opt}</div>`).join('')}
    </div>
  </div>
  <button class="sata-submit-btn" id="bt-submit-${i}" style="margin-top:14px" onclick="submitBowtie(${i})">Submit Bow-Tie</button>`;
}

// ════════════════════════════════════════════════════
//  ANSWER LOGIC
// ════════════════════════════════════════════════════
let mcqSel = {}; // tracks selected MCQ choice per question index

function selectMCQ(qIdx, chosenIdx) {
  if (answeredQ[qIdx] !== null) return;
  const q = questions[qIdx];
  // Deselect previous
  q.options.forEach((_,j) => {
    document.getElementById(`opt-${qIdx}-${j}`).classList.remove('selected-pending');
  });
  mcqSel[qIdx] = chosenIdx;
  document.getElementById(`opt-${qIdx}-${chosenIdx}`).classList.add('selected-pending');
  document.getElementById(`mcq-submit-${qIdx}`).disabled = false;
}

function answerMCQ(qIdx) {
  if (answeredQ[qIdx] !== null) return;
  if (mcqSel[qIdx] === undefined) return;
  const q = questions[qIdx];
  const chosenIdx = mcqSel[qIdx];
  const isCorrect = chosenIdx === q.correct;
  answeredQ[qIdx] = isCorrect;
  if (isCorrect) score++;

  // Style buttons
  q.options.forEach((_,j) => {
    const btn = document.getElementById(`opt-${qIdx}-${j}`);
    btn.disabled = true;
    btn.classList.remove('selected-pending');
    if (j === q.correct) btn.classList.add(chosenIdx === j ? 'correct' : 'reveal-correct');
    if (j === chosenIdx && !isCorrect) btn.classList.add('incorrect');
  });

  document.getElementById(`mcq-submit-${qIdx}`).disabled = true;
  showRationale(qIdx);
  updateNavDot(qIdx, isCorrect);
  updateScoreChip(qIdx);
  if (isCorrect) showPopup(true);
  updateProgress();
}

let sataSel = {};
function toggleSATA(qIdx, optIdx) {
  if (answeredQ[qIdx] !== null) return;
  const key = `${qIdx}-${optIdx}`;
  const el = document.getElementById(`sataopt-${qIdx}-${optIdx}`);
  if (!sataSel[qIdx]) sataSel[qIdx] = new Set();
  if (sataSel[qIdx].has(optIdx)) {
    sataSel[qIdx].delete(optIdx);
    el.classList.remove('selected');
    document.getElementById(`satacheck-${qIdx}-${optIdx}`).classList.remove('selected');
  } else {
    sataSel[qIdx].add(optIdx);
    el.classList.add('selected');
    document.getElementById(`satacheck-${qIdx}-${optIdx}`).classList.add('selected');
  }
}

function submitSATA(qIdx) {
  if (answeredQ[qIdx] !== null) return;
  const q = questions[qIdx];
  const sel = sataSel[qIdx] ? [...sataSel[qIdx]] : [];
  const correct = q.correct;
  const isCorrect = sel.length === correct.length && correct.every(c => sel.includes(c));
  answeredQ[qIdx] = isCorrect;
  if (isCorrect) score++;

  q.options.forEach((_,j) => {
    const el = document.getElementById(`sataopt-${qIdx}-${j}`);
    el.classList.add('locked');
    const isCorr = correct.includes(j);
    const isSel = sel.includes(j);
    if (isSel && isCorr) el.classList.add('correct-sel');
    else if (isSel && !isCorr) el.classList.add('incorrect-sel');
    else if (!isSel && isCorr) el.classList.add('missed');
  });

  document.getElementById(`sata-submit-${qIdx}`).disabled = true;
  showRationale(qIdx);
  updateNavDot(qIdx, isCorrect);
  updateScoreChip(qIdx);
  if (isCorrect) showPopup(true);
  updateProgress();
}

let matrixSel = {};
function selectMatrix(qIdx, row, col) {
  if (answeredQ[qIdx] !== null) return;
  if (!matrixSel[qIdx]) matrixSel[qIdx] = {};
  const cols = questions[qIdx].cols.length;
  for (let c = 0; c < cols; c++) {
    const btn = document.getElementById(`mrad-${qIdx}-${row}-${c}`);
    btn.classList.remove('selected');
  }
  matrixSel[qIdx][row] = col;
  document.getElementById(`mrad-${qIdx}-${row}-${col}`).classList.add('selected');
}

function submitMatrix(qIdx) {
  if (answeredQ[qIdx] !== null) return;
  const q = questions[qIdx];
  const allAnswered = q.rows.every((_, r) => matrixSel[qIdx] && matrixSel[qIdx][r] !== undefined);
  if (!allAnswered) {
    alert('Please answer all rows before submitting.');
    return;
  }
  let allCorrect = true;
  q.rows.forEach((_, r) => {
    const chosen = matrixSel[qIdx][r];
    if (chosen !== q.correct[r]) allCorrect = false;
  });
  answeredQ[qIdx] = allCorrect;
  if (allCorrect) score++;

  // Lock all radio buttons
  q.rows.forEach((_, r) => {
    const cols = q.cols.length;
    for (let c = 0; c < cols; c++) {
      const btn = document.getElementById(`mrad-${qIdx}-${r}-${c}`);
      btn.onclick = null;
    }
  });
  document.getElementById(`matrix-submit-${qIdx}`).disabled = true;
  showRationale(qIdx);
  updateNavDot(qIdx, allCorrect);
  updateScoreChip(qIdx);
  if (allCorrect) showPopup(true);
  updateProgress();
}

let btwieLeft = {}, btwieRight = {};
function toggleBowtieLeft(qIdx, j) {
  if (answeredQ[qIdx] !== null) return;
  if (!btwieLeft[qIdx]) btwieLeft[qIdx] = new Set();
  const el = document.getElementById(`btleft-${qIdx}-${j}`);
  if (btwieLeft[qIdx].has(j)) {
    btwieLeft[qIdx].delete(j);
    el.classList.remove('selected');
  } else {
    if (btwieLeft[qIdx].size >= 2) return;
    btwieLeft[qIdx].add(j);
    el.classList.add('selected');
  }
}
function toggleBowtieRight(qIdx, j) {
  if (answeredQ[qIdx] !== null) return;
  if (!btwieRight[qIdx]) btwieRight[qIdx] = new Set();
  const el = document.getElementById(`btright-${qIdx}-${j}`);
  if (btwieRight[qIdx].has(j)) {
    btwieRight[qIdx].delete(j);
    el.classList.remove('selected');
  } else {
    if (btwieRight[qIdx].size >= 2) return;
    btwieRight[qIdx].add(j);
    el.classList.add('selected');
  }
}
function submitBowtie(qIdx) {
  if (answeredQ[qIdx] !== null) return;
  const q = questions[qIdx];
  const lSel = btwieLeft[qIdx] ? [...btwieLeft[qIdx]] : [];
  const rSel = btwieRight[qIdx] ? [...btwieRight[qIdx]] : [];
  const lCorrect = q.correctLeft;
  const rCorrect = q.correctRight;
  const lOk = lSel.length === lCorrect.length && lCorrect.every(c => lSel.includes(c));
  const rOk = rSel.length === rCorrect.length && rCorrect.every(c => rSel.includes(c));
  const allOk = lOk && rOk;
  answeredQ[qIdx] = allOk;
  if (allOk) score++;

  // Style left options
  q.leftOptions.forEach((_,j) => {
    const el = document.getElementById(`btleft-${qIdx}-${j}`);
    el.classList.add('locked');
    el.onclick = null;
    if (lSel.includes(j) && lCorrect.includes(j)) el.classList.add('correct-sel');
    else if (lSel.includes(j) && !lCorrect.includes(j)) el.classList.add('incorrect-sel');
    else if (!lSel.includes(j) && lCorrect.includes(j)) el.classList.add('reveal-correct');
  });
  // Style right options
  q.rightOptions.forEach((_,j) => {
    const el = document.getElementById(`btright-${qIdx}-${j}`);
    el.classList.add('locked');
    el.onclick = null;
    if (rSel.includes(j) && rCorrect.includes(j)) el.classList.add('correct-sel');
    else if (rSel.includes(j) && !rCorrect.includes(j)) el.classList.add('incorrect-sel');
    else if (!rSel.includes(j) && rCorrect.includes(j)) el.classList.add('reveal-correct');
  });

  document.getElementById(`bt-submit-${qIdx}`).disabled = true;
  showRationale(qIdx);
  updateNavDot(qIdx, allOk);
  updateScoreChip(qIdx);
  if (allOk) showPopup(true);
  updateProgress();
}

// ════════════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════════════
function showRationale(qIdx) {
  document.getElementById(`rationale-${qIdx}`).classList.add('show');
}

function updateNavDot(qIdx, correct) {
  const dot = document.getElementById(`qdot-${qIdx}`);
  if (dot) {
    dot.classList.remove('current');
    dot.classList.add(correct ? 'answered-correct' : 'answered-wrong');
  }
}

function updateScoreChip(qIdx) {
  const answered = answeredQ.filter(a => a !== null).length;
  document.querySelectorAll('[id^="scorechip-"]').forEach(chip => {
    chip.textContent = `Score: ${score}/${answered}`;
  });
}

function updateProgress() {
  const answered = answeredQ.filter(a => a !== null).length;
  const pct = Math.max(1.67, (answered / questions.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
}

function goTo(idx) {
  if (idx < 0 || idx >= questions.length) {
    if (idx >= questions.length) { showScore(); return; }
    return;
  }
  document.getElementById('qscreen-' + currentQ).classList.remove('active');
  currentQ = idx;
  document.getElementById('qscreen-' + currentQ).classList.add('active');
  document.getElementById('headerCounter').textContent = `Q ${idx+1} / ${questions.length}`;

  // Update nav dot current
  document.querySelectorAll('.q-nav-dot').forEach((d,i) => {
    d.classList.toggle('current', i === idx);
  });

  // Update next button behavior for last question
  const nextBtn = document.getElementById(`nextbtn-${idx}`);
  if (nextBtn && idx === questions.length - 1) {
    nextBtn.textContent = 'View Results 🏆';
    nextBtn.onclick = showScore;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showScore() {
  document.getElementById('examWrapper').style.display = 'none';
  document.getElementById('scoreScreen').classList.add('active');

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('scorePercent').textContent = pct + '%';

  let grade = '';
  if (pct >= 90) grade = 'Outstanding! You\'re more than ready for this exam. 🌟';
  else if (pct >= 80) grade = 'Great work! Strong pharmacology foundations. Review your misses. 💪';
  else if (pct >= 70) grade = 'Good effort! A few more review sessions and you\'ll ace it. 📚';
  else grade = 'Keep studying! Focus on mechanisms and hold parameters. You\'ve got this! 💜';

  document.getElementById('scoreSubtitle').textContent = `You scored ${score} out of ${questions.length} (${pct}%). ${grade}`;

  // Category breakdown
  const categories = {};
  questions.forEach((q,i) => {
    if (!categories[q.topic]) categories[q.topic] = { total: 0, correct: 0 };
    categories[q.topic].total++;
    if (answeredQ[i] === true) categories[q.topic].correct++;
  });

  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = Object.entries(categories).map(([cat, data]) => `
    <div class="category-card">
      <div class="cat-name">${cat}</div>
      <div class="cat-score">${data.correct}/${data.total}</div>
    </div>`).join('');
}

function restartExam() {
  score = 0;
  currentQ = 0;
  answeredQ = new Array(questions.length).fill(null);
  sataSel = {}; matrixSel = {}; btwieLeft = {}; btwieRight = {}; mcqSel = {};

  document.getElementById('scoreScreen').classList.remove('active');
  document.getElementById('examWrapper').style.display = '';
  document.getElementById('examWrapper').innerHTML = '';
  buildAllQuestions();
  buildQNavGrid();
  goTo(0);
  updateProgress();
}

// ════════════════════════════════════════════════════
//  POPUP
// ════════════════════════════════════════════════════
function showPopup(correct) {
  if (!correct) return;
  const msg = CORRECT_MESSAGES[Math.floor(Math.random() * CORRECT_MESSAGES.length)];
  document.getElementById('popupEmoji').textContent = msg.emoji;
  document.getElementById('popupTitle').textContent = msg.title;
  document.getElementById('popupMsg').textContent = msg.msg;
  document.getElementById('popupOverlay').classList.add('show');
  spawnHearts();
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('show');
}

function spawnHearts() {
  const emojis = ['💖','💜','💊','✨','⭐','💗','🌸','💫'];
  for (let i = 0; i < 8; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 80 + 10 + 'vw';
    h.style.bottom = '20px';
    h.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2500);
  }
}

// ════════════════════════════════════════════════════
//  Q NAV
// ════════════════════════════════════════════════════
function buildQNavGrid() {
  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = questions.map((_, i) => `
    <div class="q-nav-dot${i === 0 ? ' current' : ''}" id="qdot-${i}" onclick="goTo(${i}); toggleQNav();">${i+1}</div>
  `).join('');
}

function toggleQNav() {
  document.getElementById('qNavPanel').classList.toggle('open');
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildAllQuestions();
  buildQNavGrid();
  updateProgress();
});
</script>
