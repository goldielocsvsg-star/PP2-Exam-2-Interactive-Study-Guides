<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP2 Perfusion & Coagulation — Mock Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07091a;
  --surface: #0e1228;
  --card: #111629;
  --card-hover: #141933;
  --border: rgba(255,255,255,0.07);
  --border-active: rgba(99,179,237,0.4);
  --red: #e03954;
  --red-dim: rgba(224,57,84,0.15);
  --teal: #38bdf8;
  --teal-dim: rgba(56,189,248,0.12);
  --mint: #10b981;
  --mint-dim: rgba(16,185,129,0.15);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.15);
  --text: #e2e8f8;
  --text-muted: #7a869d;
  --text-soft: #a8b4cc;
  --pill-correct: rgba(16,185,129,0.18);
  --pill-incorrect: rgba(224,57,84,0.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── EKG Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,9,26,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: 0.9rem 0;
}

.ekg-wrap {
  flex: 1;
  height: 36px;
  overflow: hidden;
  position: relative;
}

.ekg-svg {
  width: 200%;
  height: 100%;
  animation: ekgScroll 3.5s linear infinite;
}

@keyframes ekgScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.header-title {
  flex-shrink: 0;
  text-align: right;
}

.header-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}

.header-title p {
  font-size: 0.7rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 0.1rem;
}

/* ── Progress Bar ── */
.progress-track {
  max-width: 900px;
  margin: 1.5rem auto 0;
  padding: 0 1.5rem;
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}

.progress-label {
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.progress-stats {
  display: flex;
  gap: 1rem;
}

.stat-badge {
  font-size: 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  padding: 0.2rem 0.65rem;
  border-radius: 20px;
  letter-spacing: 0.05em;
}

.stat-correct { background: var(--pill-correct); color: var(--mint); }
.stat-incorrect { background: var(--pill-incorrect); color: var(--red); }

.progress-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--teal));
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* ── Main ── */
.main {
  max-width: 900px;
  margin: 1.5rem auto 6rem;
  padding: 0 1.5rem;
}

/* ── Question Card ── */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  animation: cardIn 0.35s cubic-bezier(.4,0,.2,1);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.q-header {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1.5rem 1.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.q-number-badge {
  flex-shrink: 0;
  width: 42px;
  height: 42px;
  background: var(--red-dim);
  border: 1px solid rgba(224,57,84,0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--red);
}

.q-meta { flex: 1; }

.q-type-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.6rem;
}

.q-tag {
  font-size: 0.62rem;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.2rem 0.6rem;
  border-radius: 20px;
  border: 1px solid;
}

.tag-red    { color: var(--red);  border-color: rgba(224,57,84,0.3);  background: var(--red-dim); }
.tag-teal   { color: var(--teal); border-color: rgba(56,189,248,0.3); background: var(--teal-dim); }
.tag-amber  { color: var(--amber);border-color: rgba(245,158,11,0.3); background: var(--amber-dim); }
.tag-mint   { color: var(--mint); border-color: rgba(16,185,129,0.3); background: var(--mint-dim); }

.q-stem {
  font-size: 1.02rem;
  font-weight: 500;
  line-height: 1.65;
  color: var(--text);
}

.q-stem em {
  font-style: italic;
  color: var(--teal);
}

.q-stem strong {
  color: #fff;
  font-weight: 700;
}

.sata-note {
  margin: 0.75rem 1.75rem 0;
  padding: 0.6rem 0.9rem;
  background: var(--amber-dim);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: 8px;
  font-size: 0.78rem;
  color: var(--amber);
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* ── Answer Options ── */
.options-list {
  padding: 1.25rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  padding: 0.9rem 1.1rem;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.18s ease;
  text-align: left;
  width: 100%;
  font-family: 'Nunito', sans-serif;
}

.option-btn:hover:not(:disabled) {
  background: rgba(255,255,255,0.045);
  border-color: rgba(255,255,255,0.14);
  transform: translateX(3px);
}

.option-btn:disabled { cursor: default; }

.option-letter {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.18s ease;
}

.option-text {
  font-size: 0.92rem;
  line-height: 1.5;
  color: var(--text-soft);
  padding-top: 0.05rem;
  transition: color 0.18s ease;
}

/* Option states */
.option-btn.correct {
  background: rgba(16,185,129,0.08);
  border-color: rgba(16,185,129,0.4);
}
.option-btn.correct .option-letter {
  background: var(--mint);
  border-color: var(--mint);
  color: #fff;
}
.option-btn.correct .option-text { color: var(--text); }

.option-btn.incorrect {
  background: rgba(224,57,84,0.08);
  border-color: rgba(224,57,84,0.4);
}
.option-btn.incorrect .option-letter {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.option-btn.incorrect .option-text { color: var(--text); }

.option-btn.missed {
  background: rgba(245,158,11,0.07);
  border-color: rgba(245,158,11,0.35);
}
.option-btn.missed .option-letter {
  background: var(--amber);
  border-color: var(--amber);
  color: #fff;
}

/* SATA checkboxes */
.option-btn.sata-selected:not(.correct):not(.incorrect):not(.missed) {
  border-color: rgba(56,189,248,0.4);
  background: rgba(56,189,248,0.06);
}
.option-btn.sata-selected .option-letter {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}

/* ── Matrix Table ── */
.matrix-wrap {
  padding: 0 1.75rem 1.25rem;
}

.matrix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.matrix-table th {
  padding: 0.6rem 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.matrix-table th:first-child { text-align: left; }

.matrix-table td {
  padding: 0.6rem 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--text-soft);
  vertical-align: middle;
}

.matrix-table td:not(:first-child) { text-align: center; }

.matrix-table tr:last-child td { border-bottom: none; }

.matrix-radio {
  appearance: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}

.matrix-radio:checked {
  border-color: var(--teal);
  background: var(--teal);
}

.matrix-radio:checked::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
}

.matrix-radio.correct-mark { border-color: var(--mint) !important; background: var(--mint) !important; }
.matrix-radio.incorrect-mark { border-color: var(--red) !important; background: var(--red) !important; }
.matrix-radio.missed-mark { border-color: var(--amber) !important; background: var(--amber) !important; }

.matrix-row-correct td:first-child { color: var(--text); }
.matrix-row-incorrect td:first-child { color: var(--text); }

/* ── Action Bar ── */
.action-bar {
  padding: 1.25rem 1.75rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.btn-submit {
  padding: 0.7rem 1.5rem;
  background: linear-gradient(135deg, var(--red), #c2185b);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.03em;
}

.btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(224,57,84,0.35); }
.btn-submit:active { transform: translateY(0); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Rationale Box ── */
.rationale-box {
  margin: 0 1.75rem 1.5rem;
  padding: 1.1rem 1.25rem;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal);
  border-radius: 10px;
  display: none;
}

.rationale-box.show { display: block; animation: fadeUp 0.3s ease; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.rationale-title {
  font-size: 0.68rem;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--teal);
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.rationale-text {
  font-size: 0.88rem;
  line-height: 1.65;
  color: var(--text-soft);
}

.rationale-text strong { color: var(--text); font-weight: 600; }

/* ── Nav Controls ── */
.nav-controls {
  margin-top: 1.25rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.btn-nav {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.65rem 1.25rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-soft);
  font-family: 'Nunito', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
}

.btn-nav:hover:not(:disabled) {
  border-color: rgba(255,255,255,0.16);
  color: var(--text);
  background: var(--card-hover);
}

.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

.nav-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

/* ── Modal Overlay ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(7,9,26,0.82);
  backdrop-filter: blur(10px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s ease;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* Confetti canvas lives behind modal */
#confettiCanvas {
  position: fixed;
  inset: 0;
  z-index: 999;
  pointer-events: none;
}

.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2.25rem 2.5rem;
  max-width: 480px;
  width: 100%;
  text-align: center;
  transform: scale(0.88) translateY(16px);
  transition: all 0.38s cubic-bezier(.34,1.56,.64,1);
  position: relative;
  overflow: hidden;
  z-index: 1001;
}
.modal-overlay.active .modal {
  transform: scale(1) translateY(0);
}

/* Correct modal gets glowing border */
.modal.modal-correct {
  border-color: rgba(16,185,129,0.35);
  box-shadow: 0 0 40px rgba(16,185,129,0.15), 0 24px 60px rgba(0,0,0,0.5);
}
.modal.modal-incorrect {
  border-color: rgba(224,57,84,0.25);
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}

/* Shimmering top gradient bar */
.modal-accent-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 24px 24px 0 0;
}
.modal-accent-bar.correct-bar {
  background: linear-gradient(90deg, #10b981, #06d6a0, #38bdf8, #10b981);
  background-size: 200% 100%;
  animation: shimmerBar 2s linear infinite;
}
.modal-accent-bar.incorrect-bar {
  background: linear-gradient(90deg, var(--red), #c2185b);
}
@keyframes shimmerBar {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

/* Correct icon with pulse ring */
.modal-icon {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.4rem;
  font-size: 2rem;
  position: relative;
}
.modal-icon.correct-icon {
  background: var(--mint-dim);
  border: 2px solid rgba(16,185,129,0.4);
  box-shadow: 0 0 0 0 rgba(16,185,129,0.35);
  animation: pulseRing 1.6s ease-out infinite;
}
.modal-icon.incorrect-icon {
  background: var(--red-dim);
  border: 2px solid rgba(224,57,84,0.25);
}
@keyframes pulseRing {
  0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
  70%  { box-shadow: 0 0 0 16px rgba(16,185,129,0); }
  100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
}

.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.55rem;
  font-weight: 700;
  margin-bottom: 0.55rem;
  line-height: 1.2;
}
.modal-title.correct-title { color: #fff; }
.modal-title.incorrect-title { color: #fff; }

.modal-subtitle {
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 1.4rem;
}

/* Stars row for correct only */
.modal-stars {
  display: flex;
  justify-content: center;
  gap: 0.3rem;
  margin-bottom: 1rem;
  font-size: 1.1rem;
  animation: starsIn 0.5s cubic-bezier(.34,1.56,.64,1) 0.15s both;
}
@keyframes starsIn {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

.modal-score-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 1.1rem;
  border-radius: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 1.6rem;
}
.modal-score-badge.correct-badge {
  background: rgba(16,185,129,0.12);
  color: var(--mint);
  border: 1px solid rgba(16,185,129,0.25);
}
.modal-score-badge.incorrect-badge {
  background: rgba(224,57,84,0.1);
  color: var(--red);
  border: 1px solid rgba(224,57,84,0.2);
}

.btn-modal-close {
  width: 100%;
  padding: 0.9rem;
  border: none;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.04em;
}
.btn-modal-close.correct-close {
  background: linear-gradient(135deg, #10b981, #06d6a0);
  color: #fff;
  box-shadow: 0 4px 16px rgba(16,185,129,0.3);
}
.btn-modal-close.incorrect-close {
  background: rgba(255,255,255,0.07);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-modal-close:hover { opacity: 0.9; transform: translateY(-2px); }
.btn-modal-close:active { transform: translateY(0); }

/* ── Score Screen ── */
.score-screen {
  display: none;
  text-align: center;
  padding: 3rem 2rem;
}

.score-screen.show { display: block; animation: cardIn 0.4s ease; }

.score-ring {
  width: 160px;
  height: 160px;
  margin: 0 auto 2rem;
  position: relative;
}

.score-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.score-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-percent {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 600;
  color: #fff;
}

.score-label {
  font-size: 0.68rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.score-title {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  margin-bottom: 0.5rem;
}

.score-breakdown {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin: 1.5rem 0;
}

.breakdown-item {
  text-align: center;
}

.breakdown-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.8rem;
  font-weight: 600;
  display: block;
}

.breakdown-lbl {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.btn-restart {
  margin-top: 2rem;
  padding: 0.85rem 2.5rem;
  background: linear-gradient(135deg, var(--red), #c2185b);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.03em;
}

.btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(224,57,84,0.35); }

/* ── Question Map ── */
.q-map {
  margin-top: 1.5rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
}

.q-map-dot {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}

.q-map-dot.current { border-color: var(--teal); color: var(--teal); }
.q-map-dot.answered-correct { background: var(--mint-dim); border-color: rgba(16,185,129,0.4); color: var(--mint); }

let current = 0;
let answered = new Array(QUESTIONS.length).fill(null);
// answered[i] = { correct: bool, selectedIndices: [...] }
let correctCount = 0;
let incorrectCount = 0;

function init() {
  buildMap();
  renderQuestion(0);
}

function buildMap() {
  const mapEl = document.getElementById('qMap');
  mapEl.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const dot = document.createElement('button');
    dot.className = 'q-map-dot';
    dot.id = `dot-${i}`;
    dot.textContent = i + 1;
    dot.onclick = () => goTo(i);
    mapEl.appendChild(dot);
  });
}

function updateMap() {
  QUESTIONS.forEach((q, i) => {
    const dot = document.getElementById(`dot-${i}`);
    dot.className = 'q-map-dot';
    if (i === current) dot.classList.add('current');
    else if (answered[i] !== null) {
      dot.classList.add(answered[i].correct ? 'answered-correct' : 'answered-incorrect');
    }
  });
}

function updateProgress() {
  const total = QUESTIONS.length;
  const done = answered.filter(a => a !== null).length;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';
  document.getElementById('statCorrect').textContent = '✓ ' + correctCount;
  document.getElementById('statIncorrect').textContent = '✗ ' + incorrectCount;
}

function goTo(idx) {
  current = idx;
  renderQuestion(idx);
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const isAnswered = answered[idx] !== null;
  let html = '';

  // Tags HTML
  const tagMap = {
    'Priority': 'tag-red', 'Emergency': 'tag-red', 'Contraindication': 'tag-red',
    'HTN': 'tag-teal', 'MI': 'tag-teal', 'HF': 'tag-teal', 'DVT': 'tag-teal',
    'Teaching': 'tag-mint', 'SATA': 'tag-amber', 'Matrix': 'tag-amber',
    'Synthesis': 'tag-amber', 'Triage': 'tag-red', 'Pathophysiology': 'tag-teal'
  };
  const tagsHtml = q.tags.map(t => {
    const cls = tagMap[t] || 'tag-teal';
    return `<span class="q-tag ${cls}">${t}</span>`;
  }).join('');

  html += `
  <div class="q-card">
    <div class="q-header">
      <div class="q-number-badge">${String(idx + 1).padStart(2,'0')}</div>
      <div class="q-meta">
        <div class="q-type-tags">${tagsHtml}</div>
        <div class="q-stem">${q.stem}</div>
      </div>
    </div>
  `;

  if (q.type === 'sata') {
    html += `<div class="sata-note">⬛ Select All That Apply — choose every option that applies before submitting.</div>`;
  }

  if (q.type === 'mc' || q.type === 'sata') {
    html += `<div class="options-list" id="optionsList">`;
    const letters = ['A','B','C','D','E','F'];
    q.options.forEach((opt, i) => {
      let cls = '';
      if (isAnswered) {
        const isCorrect = q.type === 'mc'
          ? (i === q.correct)
          : q.correctSet.includes(i);
        const wasSelected = answered[idx].selectedIndices.includes(i);
        if (isCorrect && wasSelected) cls = 'correct';
        else if (!isCorrect && wasSelected) cls = 'incorrect';
        else if (isCorrect && !wasSelected) cls = 'missed';
      } else {
        // not answered yet, check if sata-selected
        // we'll handle selection state via JS
      }
      html += `
      <button class="option-btn ${cls}" id="opt-${i}" data-idx="${i}"
        ${isAnswered ? 'disabled' : ''}
        onclick="handleOptionClick(${i})">
        <span class="option-letter">${letters[i]}</span>
        <span class="option-text">${opt}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (q.type === 'matrix') {
    html += buildMatrixHTML(q, idx, isAnswered);
  }

  // Action bar
  html += `<div class="action-bar">`;
  if (!isAnswered) {
    html += `<button class="btn-submit" id="submitBtn" onclick="submitAnswer()">${q.type === 'sata' ? 'Submit Selections' : (q.type === 'matrix' ? 'Submit Matrix' : 'Submit Answer')}</button>`;
    if (q.type === 'mc') {
      html += `<span style="font-size:0.78rem;color:var(--text-muted)">Select one answer</span>`;
    }
  } else {
    html += `<span style="font-size:0.78rem;color:var(--text-muted);font-style:italic">Answer recorded</span>`;
  }
  html += `</div>`;

  // Rationale
  html += `<div class="rationale-box ${isAnswered ? 'show' : ''}" id="rationaleBox">
    <div class="rationale-title">📋 Rationale</div>
    <div class="rationale-text">${q.rationale}</div>
  </div>`;

  html += `</div>`; // end q-card

  // Nav
  html += `
  <div class="nav-controls">
    <button class="btn-nav" onclick="prevQ()" ${idx === 0 ? 'disabled' : ''}>
      ← Previous
    </button>
    <span class="nav-count">${idx + 1} / ${QUESTIONS.length}</span>
    ${idx === QUESTIONS.length - 1
      ? `<button class="btn-nav" onclick="showScore()" style="border-color:rgba(224,57,84,0.4);color:var(--red)">View Results →</button>`
      : `<button class="btn-nav" id="nextBtn" onclick="nextQ()" ${!isAnswered ? 'disabled style="opacity:0.35;cursor:not-allowed"' : ''}>Next →</button>`
    }
  </div>`;

  document.getElementById('questionArea').innerHTML = html;
  updateMap();
  updateProgress();

  // ── Reset pending selection state on every navigation ──
  // CRITICAL: use the module-level let variables, NOT window.* properties
  _selectedMC = null;
  _selectedSATA = new Set();
  _selectedMatrix = {};
}

function buildMatrixHTML(q, idx, isAnswered) {
  let html = `<div class="matrix-wrap"><table class="matrix-table">
    <thead><tr>
      <th style="width:45%">Intervention</th>
      ${q.cols.map(c => `<th>${c}</th>`).join('')}
    </tr></thead>
    <tbody>`;

  q.rows.forEach((row, ri) => {
    let rowClass = '';
    if (isAnswered) {
      const userSel = answered[idx].selectedMatrix ? answered[idx].selectedMatrix[ri] : null;
      const correct = q.correctMap[ri];
      rowClass = (userSel === correct) ? 'matrix-row-correct' : 'matrix-row-incorrect';
    }
    html += `<tr class="${rowClass}">
      <td>${row}</td>
      ${q.cols.map((col, ci) => {
        let radioClass = '';
        let checked = '';
        if (isAnswered) {
          const userSel = answered[idx].selectedMatrix ? answered[idx].selectedMatrix[ri] : null;
          const correctSel = q.correctMap[ri];
          if (ci === correctSel) radioClass = 'correct-mark';
          else if (ci === userSel && userSel !== correctSel) radioClass = 'incorrect-mark';
          checked = (ci === userSel) ? 'checked' : '';
        }
        return `<td><input type="radio" class="matrix-radio ${radioClass}"
          name="row-${ri}" value="${ci}"
          ${checked}
          ${isAnswered ? 'disabled' : ''}
          onchange="handleMatrixChange(${ri}, ${ci})"></td>`;
      }).join('')}
    </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

let _selectedMC = null;
let _selectedSATA = new Set();
let _selectedMatrix = {};

function handleOptionClick(idx) {
  const q = QUESTIONS[current];
  if (q.type === 'mc') {
    _selectedMC = idx;
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.classList.remove('sata-selected');
    });
    const clicked = document.getElementById(`opt-${idx}`);
    if (clicked) {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('sata-selected'));
      clicked.classList.add('sata-selected');
    }
  } else if (q.type === 'sata') {
    if (!_selectedSATA) _selectedSATA = new Set();
    if (_selectedSATA.has(idx)) {
      _selectedSATA.delete(idx);
      document.getElementById(`opt-${idx}`).classList.remove('sata-selected');
    } else {
      _selectedSATA.add(idx);
      document.getElementById(`opt-${idx}`).classList.add('sata-selected');
    }
  }
}

function handleMatrixChange(rowIdx, colIdx) {
  if (!_selectedMatrix) _selectedMatrix = {};
  _selectedMatrix[rowIdx] = colIdx;
}

function submitAnswer() {
  const q = QUESTIONS[current];
  if (answered[current] !== null) return;

  let isCorrect = false;
  let selectedIndices = [];
  let selectedMatrix = {};

  if (q.type === 'mc') {
    if (_selectedMC === null) {
      shakeSubmit(); return;
    }
    selectedIndices = [_selectedMC];
    isCorrect = (_selectedMC === q.correct);
  } else if (q.type === 'sata') {
    if (!_selectedSATA || _selectedSATA.size === 0) {
      shakeSubmit(); return;
    }
    selectedIndices = [..._selectedSATA];
    const correctSet = new Set(q.correctSet);
    const selectedSet = new Set(selectedIndices);
    isCorrect = (selectedSet.size === correctSet.size) &&
      [...selectedSet].every(v => correctSet.has(v));
  } else if (q.type === 'matrix') {
    selectedMatrix = {..._selectedMatrix};
    // check all rows answered
    if (Object.keys(selectedMatrix).length < q.rows.length) {
      shakeSubmit(); return;
    }
    isCorrect = q.rows.every((_, ri) => selectedMatrix[ri] === q.correctMap[ri]);
    selectedIndices = [];
  }

  answered[current] = { correct: isCorrect, selectedIndices, selectedMatrix };
  if (isCorrect) correctCount++;
  else incorrectCount++;

  _selectedMC = null;
  _selectedSATA = new Set();
  _selectedMatrix = {};

  showModal(isCorrect);
  renderQuestion(current);
}

function shakeSubmit() {
  const btn = document.getElementById('submitBtn');
  if (!btn) return;
  btn.style.animation = 'shake 0.4s ease';
  setTimeout(() => btn.style.animation = '', 500);
}

const confettiColors = ['#10b981','#38bdf8','#06d6a0','#a78bfa','#f0abfc','#fbbf24','#34d399'];
let confettiParticles = [];
let confettiAnimId = null;

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';

  confettiParticles = [];
  for (let i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 80,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 4,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: 2.5 + Math.random() * 3,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 8,
      opacity: 1
    });
  }

  let elapsed = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    elapsed++;
    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      p.vy += 0.04; // gravity
      if (elapsed > 60) p.opacity -= 0.012;
      p.opacity = Math.max(0, p.opacity);

      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x + p.w/2, p.y + p.h/2);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });

    const allDone = confettiParticles.every(p => p.opacity <= 0 || p.y > canvas.height + 20);
    if (!allDone) {
      confettiAnimId = requestAnimationFrame(draw);
    } else {
      canvas.style.display = 'none';
    }
  }

  if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
  draw();
}

function showModal(isCorrect) {
  const overlay = document.getElementById('modalOverlay');
  const modal   = document.getElementById('modal');
  const icon    = document.getElementById('modalIcon');
  const stars   = document.getElementById('modalStars');
  const title   = document.getElementById('modalTitle');
  const sub     = document.getElementById('modalSubtitle');
  const badge   = document.getElementById('modalScoreBadge');
  const closeBtn= document.getElementById('modalCloseBtn');
  const accentBar = document.getElementById('modalAccentBar');

  const total = correctCount + incorrectCount;
  const pct = Math.round((correctCount / total) * 100);

  if (isCorrect) {
    const msg = CORRECT_MESSAGES[Math.floor(Math.random() * CORRECT_MESSAGES.length)];

    modal.className = 'modal modal-correct';
    accentBar.className = 'modal-accent-bar correct-bar';

    icon.className = 'modal-icon correct-icon';
    icon.textContent = '✓';

    stars.style.display = 'flex';

    title.className = 'modal-title correct-title';
    title.textContent = msg.title;

    sub.textContent = msg.sub;

    badge.className = 'modal-score-badge correct-badge';
    badge.innerHTML = `📊 Score: ${correctCount} / ${total} &nbsp;·&nbsp; ${pct}%`;

    closeBtn.className = 'btn-modal-close correct-close';
    closeBtn.textContent = 'Continue to Next Question →';

    // Launch confetti after modal appears
    setTimeout(launchConfetti, 200);

  } else {
    const msg = INCORRECT_MESSAGES[Math.floor(Math.random() * INCORRECT_MESSAGES.length)];

    modal.className = 'modal modal-incorrect';
    accentBar.className = 'modal-accent-bar incorrect-bar';

    icon.className = 'modal-icon incorrect-icon';
    icon.textContent = '✗';

    stars.style.display = 'none';

    title.className = 'modal-title incorrect-title';
    title.textContent = msg.title;

    sub.textContent = msg.sub;

    badge.className = 'modal-score-badge incorrect-badge';
    badge.innerHTML = `📊 Score: ${correctCount} / ${total} &nbsp;·&nbsp; ${pct}%`;

    closeBtn.className = 'btn-modal-close incorrect-close';
    closeBtn.textContent = 'Review Rationale Below';
  }

  overlay.classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  // Let confetti finish naturally — don't cancel it so it trails off nicely
}

function nextQ() {
  if (answered[current] === null) return;
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion(current);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    renderQuestion(current);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showScore() {
  document.getElementById('questionArea').style.display = 'none';
  document.querySelector('.nav-controls') && document.querySelector('.nav-controls').remove();

  const total = QUESTIONS.length;
  const pct = Math.round(correctCount / total * 100);
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('breakdownCorrect').textContent = correctCount;
  document.getElementById('breakdownIncorrect').textContent = incorrectCount;

  let grade = '';
  if (pct >= 90) grade = 'Outstanding Performance';
  else if (pct >= 80) grade = 'Above Average — Well Done!';
  else if (pct >= 75) grade = 'Passing Score Achieved';
  else if (pct >= 65) grade = 'Keep Studying — You\'re Getting There';
  else grade = 'Review Recommended — Don\'t Give Up!';

  document.getElementById('scoreGrade').textContent = grade;

  // Animate ring
  const circumference = 2 * Math.PI * 70;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => {
    document.getElementById('scoreRingArc').style.transition = 'stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)';
    document.getElementById('scoreRingArc').style.strokeDashoffset = offset;
  }, 100);

  document.getElementById('scoreScreen').classList.add('show');
  document.getElementById('progressFill').style.width = '100%';
}

function restartExam() {
  current = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  correctCount = 0;
  incorrectCount = 0;
  _selectedMC = null;
  _selectedSATA = new Set();
  _selectedMatrix = {};
  // Clean up confetti
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  const canvas = document.getElementById('confettiCanvas');
  if (canvas) { canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  document.getElementById('scoreScreen').classList.remove('show');
  document.getElementById('questionArea').style.display = '';
  document.getElementById('scoreRingArc').style.strokeDashoffset = '439.82';
  init();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// CSS for shake animation
const style = document.createElement('style');
style.textContent = `
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}`;
document.head.appendChild(style);

// Init
init();
</script>
